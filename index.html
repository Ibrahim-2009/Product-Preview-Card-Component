<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <article class="card">
      <section class="image-side">
        <picture>
          <source media="(max-width: 640px)" srcset="images/image-product-mobile.jpg">
          <img class="image" src="images/image-product-desktop.jpg" alt="Perfume Picture">
        </picture>
      </section>
      <section class="text-side">
        <h1 class="heading">PERFUME</h1>

        <h2 class="product-name">Gabrielle Essence Eau De Parfum</h2>

        <p class="para">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

        <div class="prices">
          <p class="price">$149.99</p>
          <p class="discount"><del>$169.99</del></p>
        </div>

        <button class="cart" type="button"><img class="cart-img" src="images/icon-cart.svg" alt="Cart Icon">Add to Cart</button>
      </section>
    </article>
  </main>
</body>
</html>
